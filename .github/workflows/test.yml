name: Verify SponsorProof
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: pip install genvm-linter==0.11.0 genlayer-test==0.29.2
      - run: genvm-lint check contracts/sponsorproof.py
      - run: python scripts/direct-test.py
